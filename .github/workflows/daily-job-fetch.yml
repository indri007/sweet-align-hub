name: Daily Job Fetch (5 lowongan jam 9 pagi WIB)

on:
  schedule:
    # Jam 9 pagi WIB = jam 2 pagi UTC (WIB itu UTC+7)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Supaya bisa dijalankan manual juga dari tab Actions di GitHub

jobs:
  fetch-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan daily_fetch.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          EMBEDDING_MODEL: local
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
        run: |
          python3 daily_fetch.py
